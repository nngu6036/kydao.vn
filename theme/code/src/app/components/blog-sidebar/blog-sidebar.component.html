<div [class]="sidebarClass">
    <div class="single-sidebar-widget ">
        <div class="wid-title">
            <h3>Search</h3>
        </div>
        <div class="search-widget">
            <form action="#">
                <input type="text" placeholder="Type here">
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>
        </div>
    </div>
    <div class="single-sidebar-widget">
        <div class="wid-title">
            <h3>Recent Post</h3>
        </div>
        <div class="recent-post-area">
            <div class="recent-items" *ngFor="let post of recentPosts">
                <div class="recent-content">
                    <ul>
                        <li>
                            <i class="fa-regular fa-folder-open"></i>
                            {{ post.category }}
                        </li>
                    </ul>
                    <h5>
                        <a [routerLink]="post.link">
                            {{ post.title }}
                        </a>
                    </h5>
                </div>
            </div>
        </div>
    </div>
    <div class="single-sidebar-widget">
        <div class="wid-title">
            <h3>Categories</h3>
        </div>
        <div [class]="categoryClass">
            <ul>
                <li *ngFor="let cat of categories" [class.active]="cat.active">
                    <a [routerLink]="cat.link">{{ cat.title }} <span>{{ cat.count }}</span></a>
                </li>
            </ul>
        </div>
    </div>
    <div class="single-sidebar-widget style2 bg-cover ">
        <div class="wid-title">
            <h3 class="text-center">GET TOUCH</h3>
        </div>
        <div class="get-touch">
            <a href="tel:+888123456765" class="phoneIcon" aria-label="Call for fast service">
                <i class="fa-regular fa-phone"></i>
            </a>
            <h6>For fast service</h6>
            <h4 class="number"><a href="tel:+888123456765">(+888) 123 456 765</a></h4>
        </div>

    </div>
    <div class="single-sidebar-widget style3">
        <div class="wid-title">
            <h3>Tags</h3>
        </div>
        <div [class]="categoryClass">
            <div class="tagcloud">
                <a *ngFor="let tag of tags" [routerLink]="tag.link">{{ tag.title }}</a>
            </div>
        </div>
    </div>
</div>
