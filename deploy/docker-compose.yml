services:
  mongo:
    image: mongo:7
    container_name: chess-elo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: chess-elo-redis
    ports:
      - "6379:6379"

  api:
    image: chess-elo-api
    build:
      context: ../apps/api
    container_name: chess-elo-api
    env_file:
      - ../apps/api/.env
    environment:
      CHESS_ELO_MONGODB_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  celery-worker:
    image: chess-elo-api
    build:
      context: ../apps/api
    container_name: chess-elo-celery-worker
    env_file:
      - ../apps/api/.env
    environment:
      CHESS_ELO_MONGODB_URI: mongodb://mongo:27017
      CHESS_ELO_CELERY_BROKER_URL: redis://redis:6379/0
      CHESS_ELO_CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHESS_ELO_CELERY_TIMEZONE: Australia/Sydney
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    depends_on:
      - mongo
      - redis

  celery-beat:
    image: chess-elo-api
    build:
      context: ../apps/api
    container_name: chess-elo-celery-beat
    env_file:
      - ../apps/api/.env
    environment:
      CHESS_ELO_MONGODB_URI: mongodb://mongo:27017
      CHESS_ELO_CELERY_BROKER_URL: redis://redis:6379/0
      CHESS_ELO_CELERY_RESULT_BACKEND: redis://redis:6379/1
      CHESS_ELO_CELERY_TIMEZONE: Australia/Sydney
    command: celery -A app.celery_app:celery_app beat --loglevel=info --schedule=/app/celerybeat/celerybeat-schedule
    volumes:
      - celery-beat-data:/app/celerybeat
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: chess-elo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mongo-data:
  celery-beat-data:
