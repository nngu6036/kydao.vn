services:
  mongo:
    image: mongo:7
    container_name: chess-elo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    image: chess-elo-api
    build:
      context: ../apps/api
    container_name: chess-elo-api
    env_file:
      - ../apps/api/.env
    environment:
      CHESS_ELO_MONGODB_URI: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      - mongo

  nginx:
    image: nginx:1.27-alpine
    container_name: chess-elo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mongo-data:
